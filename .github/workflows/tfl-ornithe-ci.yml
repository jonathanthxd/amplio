name: TFL Ornithe compatibility CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tfl-amplio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-and-contract:
    name: Java 25 / source and dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate TFL integration contract
        run: python3 tools/tfl_ci_contracts.py

      - name: Compile Java source without packaging untested native binaries
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileJava

      - name: Summarize limitations
        if: always()
        run: |
          echo '### TFL Amplio validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- This workflow validates source contracts and Java compilation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The upstream build.yml separately builds Windows/Linux NVIDIA native libraries and a JAR.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pylon is optional in this fork; Legacy LWJGL3 graphics runtime still requires hardware validation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- NOT verified: NVIDIA DLSS hardware, Vulkan/OpenGL interop, Lucerna shader pipeline, TFL Core framebuffer and GUI.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No installable or release artifact is published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
